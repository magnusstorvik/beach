<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <meta name='robots' content='noindex'>
  <meta name='theme-color' content='#0e2733'>
  <title>Page not found · Vikaneset Retreat</title>
  <link rel='icon' type='image/png' sizes='64x64' href='/beach/assets/images/favicon.png'>
  <style>
    @font-face {
      font-family: 'Spectral';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('/beach/assets/fonts/spectral-400.woff2') format('woff2');
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
      background:
        radial-gradient(ellipse at 12% 18%, rgba(157, 192, 212, 0.07), transparent 42%),
        radial-gradient(ellipse at 88% 84%, rgba(0, 0, 0, 0.22), transparent 46%),
        linear-gradient(145deg, #14303c, #081b24 74%);
      color: rgba(255, 255, 255, 0.86);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(100%, 30rem);
      text-align: center;
    }

    .mark {
      display: block;
      width: 64px;
      height: auto;
      margin: 0 auto 1.6rem;
    }

    .eyebrow {
      margin-bottom: 0.9rem;
      color: #9dc0d4;
      font-family: 'Spectral', Georgia, serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.24em;
    }

    h1 {
      margin-bottom: 0.4rem;
      color: #fff;
      font-family: 'Spectral', Georgia, serif;
      font-size: clamp(1.7rem, 5vw, 2.3rem);
      font-weight: 400;
      line-height: 1.2;
      text-wrap: balance;
    }

    .alt {
      margin-bottom: 2rem;
      color: rgba(255, 255, 255, 0.72);
      font-family: 'Spectral', Georgia, serif;
      font-size: 1.1rem;
      font-style: italic;
    }

    .home {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.85rem 1.3rem;
      border: 1px solid rgba(157, 192, 212, 0.34);
      border-radius: 8px;
      background: rgba(14, 39, 51, 0.68);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      color: rgba(255, 255, 255, 0.94);
      font-family: 'Spectral', Georgia, serif;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-decoration: none;
      text-transform: uppercase;
      transition: border-color 0.25s ease, background 0.25s ease;
    }

    .home:hover,
    .home:focus-visible {
      border-color: rgba(157, 192, 212, 0.6);
      background: rgba(20, 48, 60, 0.82);
    }

    .home:focus-visible {
      outline: 2px solid #9dc0d4;
      outline-offset: 3px;
    }

    .home .arrow {
      color: #9dc0d4;
    }
  </style>
</head>
<body>
  <main>
    <img class='mark' src='/beach/assets/images/logo-mark-light.png' alt='' width='157' height='114'>
    <p class='eyebrow'>404</p>
    <h1>This page could not be found.</h1>
    <p class='alt' lang='no'>Denne siden finnes ikke.</p>
    <a class='home' href='/beach/'><span>Back to Vikaneset · <span lang='no'>Tilbake</span></span> <span class='arrow' aria-hidden='true'>&rarr;</span></a>
  </main>
</body>
</html>
